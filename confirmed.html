<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Booking confirmed - ABC Tutoring</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>&#128218;</text></svg>">
<link rel="stylesheet" href="/css/styles.css">
<script src="/js/config.js"></script>
<script src="/js/schedule.js"></script>
<script src="/js/api.js"></script>
<script src="/js/analytics.js"></script>
</head>
<body>

<header class="site-header">
  <div class="wrap">
    <a class="brand" href="/"><span class="brand-mark">ABC</span> ABC Tutoring</a>
    <nav class="nav">
      <a href="/">Home</a>
      <a href="/tutors.html">Our tutors</a>
      <a href="/book.html">Book a session</a>
    </nav>
  </div>
</header>

<main class="wrap">
  <section class="pane confirm-card" id="card">
    <p class="loading">Loading your confirmation...</p>
  </section>
</main>

<footer class="site-footer">
  <div class="wrap">
    <span>ABC Tutoring &middot; hello@abctutoring.example &middot; (555) 014-2200</span>
    <span>Weekdays after school &amp; Saturday mornings</span>
  </div>
</footer>

<script src="/js/ui.js"></script>
<script>
(function () {
  const card = document.getElementById('card');
  const raw = sessionStorage.getItem('abc-last-booking');

  if (!raw) {
    card.innerHTML = `<h1>Nothing to show yet</h1>
      <p class="hint">We don't have a recent booking in this browser.</p>
      <p><a class="btn btn-primary" href="/book.html">Book a session</a></p>`;
    return;
  }

  const { booking, notifications } = JSON.parse(raw);
  const when = `${UI.formatDateLong(booking.date)} at ${UI.formatTime(booking.time)}`;

  card.innerHTML = `
    <div class="check">&#10003;</div>
    <h1>You're booked!</h1>
    <p class="hint">Confirmation ${UI.esc(booking.id)}</p>
    <div class="confirm-details">
      <div class="summary-row"><span>Tutor</span><span>${UI.esc(booking.tutorName)}</span></div>
      <div class="summary-row"><span>When</span><span>${UI.esc(when)}</span></div>
      <div class="summary-row"><span>Subject</span><span>${UI.esc(booking.subject)}</span></div>
      <div class="summary-row"><span>Student</span><span>${UI.esc(booking.studentFirstName)}, grade ${UI.esc(booking.studentGrade)}</span></div>
      <div class="summary-row"><span>Rate</span><span>$${booking.rate}/hour, paid directly</span></div>
    </div>
    <ul class="notice-list">
      ${notifications.map((n) => `<li><strong>${n.channel === 'sms' ? 'Text' : 'Email'}</strong> sent to ${UI.esc(n.to)}${n.subject ? ` - ${UI.esc(n.subject)}` : ''}</li>`).join('')}
      <li>That hour is now off ${UI.esc(booking.tutorName)}'s calendar.</li>
    </ul>
    <p style="margin-top:24px">
      <a class="btn btn-ghost" href="/tutors.html">Book another session</a>
    </p>`;

  Analytics.track('confirmation_viewed', { booking_id: booking.id, tutor_id: booking.tutorId });
})();
</script>
</body>
</html>
